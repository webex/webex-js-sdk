<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Webex JS SDK Sample: User Plugin — Site Selection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.min.css">
  <style>
    .result { background: #f5f5f5; padding: 12px; border-radius: 6px; margin: 8px 0; white-space: pre-wrap; font-family: monospace; font-size: 13px; max-height: 400px; overflow-y: auto; }
    .success { border-left: 4px solid #4caf50; }
    .error { border-left: 4px solid #f44336; }
    .info { border-left: 4px solid #2196f3; }
    .site-radio { margin: 6px 0; }
    fieldset { margin: 12px 0; }
    button:disabled { opacity: 0.5; }
    #status { font-weight: bold; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>🌐 User Plugin — Site Selection</h1>
  <p>Manual validation for <code>updatePreferredWebexSite()</code> and <code>getMeetingSiteList()</code></p>

  <fieldset>
    <legend>1. Authentication</legend>
    <label for="token">Bearer Token (from web.webex.com DevTools → Network → any request → Authorization header):</label><br>
    <textarea id="token" rows="3" cols="80" placeholder="paste token here (with or without 'Bearer ' prefix)"></textarea><br>
    <button id="btn-init" onclick="initSDK()">Initialize SDK &amp; Register Device</button>
    <div id="init-status"></div>
  </fieldset>

  <fieldset>
    <legend>2. Get User Profile &amp; Site List</legend>
    <button id="btn-get-user" onclick="getUserAndSites()" disabled>Get User Profile + getMeetingSiteList()</button>
    <div id="user-result"></div>
    <div id="sites-result"></div>
  </fieldset>

  <fieldset>
    <legend>3. Select Site</legend>
    <div id="site-radios"><em>Load user profile first</em></div>
    <button id="btn-update-site" onclick="updateSite()" disabled>Update Preferred Site (SCIM PATCH)</button>
    <div id="update-result"></div>
  </fieldset>

  <fieldset>
    <legend>4. Verify Persistence</legend>
    <button id="btn-verify" onclick="verifyPersistence()" disabled>Re-fetch User &amp; Verify</button>
    <div id="verify-result"></div>
  </fieldset>

  <div id="status"></div>
  <h3>Evidence Log</h3>
  <div id="evidence-log" class="result info">Waiting for test actions...</div>

  <script src="../webex.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
