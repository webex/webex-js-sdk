# CTO Architecture Checklist
#
# Purpose:
# - Track architecture-readiness controls in a normalized, machine-readable shape.
# - Keep implementation detail in canonical documents instead of duplicating long text.
#
# Primary evidence documents:
# - docs/architecture.md
# - docs/service.md (deployable services only)
# - SECURITY.md
# - CONTRIBUTING.md
# - CHANGELOG.md

metadata:
  service: your-service-name
  owner: '@team-handle'
  reviewed_on: 2026-02-19
  checklist_version: 1

document_evidence:
  architecture: docs/architecture.md
  security: SECURITY.md
  contributing: CONTRIBUTING.md
  changelog: CHANGELOG.md

# Status values:
# - not_started
# - in_progress
# - completed
# - not_applicable
