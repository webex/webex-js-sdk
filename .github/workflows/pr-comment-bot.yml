name: PR Release Comment Bot
run-name: ${{ github.actor }} triggered release comment bot

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test version number (e.g., 3.4.0)'
        required: false
        default: '3.4.0'
      test_pr_number:
        description: 'Test PR number (e.g., 2) - leave empty to auto-detect'
        required: false
        default: ''
  workflow_run:
    workflows: ["Deploy CD"]
    types:
      - completed
    branches:
      - next

jobs:
  comment-on-prs:
    name: Comment on Released PRs
    runs-on: ubuntu-latest
    # Only run if the deploy workflow completed successfully OR if manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history to find commits
      
      - name: Setup Node.js
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      
      - name: Build Tooling
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: yarn workspaces foreach --from '@webex/*-tools' --topological-dev --parallel --verbose run build:src
      
      - name: Resolve Release Version
        id: version-info
        run: |
          # For manual testing, use the input version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.test_version }}"
            echo "🧪 TEST MODE: Using manual version ${VERSION}"
          else
            # Production mode: get real version from package-tools
            yarn ws:tools
            VERSION=$(yarn package-tools sync --tag next --packages webex | awk '{print $3}' | tr -d '%')
            echo "📦 PRODUCTION MODE: Detected version ${VERSION}"
          fi
          
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION}" >> $GITHUB_OUTPUT
          
          echo "📦 Current version: v${VERSION}"
      
      - name: Find Merged PR From Release Commit
        id: get-prs
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version-info.outputs.version }}';
            const versionNumber = '${{ steps.version-info.outputs.version_number }}';
            
            // For manual testing, allow override with specific PR number
            const testPrNumber = '${{ github.event.inputs.test_pr_number }}';
            if (testPrNumber && testPrNumber.trim() !== '') {
              console.log(`🧪 TEST MODE: Using manual PR number #${testPrNumber}`);
              const packages = ['webex', '@webex/plugin-meetings', '@webex/calling'];
              core.setOutput('pr_numbers', JSON.stringify([testPrNumber.trim()]));
              core.setOutput('packages', JSON.stringify(packages));
              core.setOutput('commit_count', '1');
              return { prs: [testPrNumber.trim()], packages: packages };
            }
            
            console.log(`Looking for PR in the most recent merge commit`);
            
            // Get the HEAD commit (the merge commit that triggered this deployment)
            let commit;
            try {
              const commitResult = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha
              });
              commit = commitResult.data;
            } catch (error) {
              console.log('Error getting commit:', error.message);
              return { prs: [], packages: [] };
            }
            
            console.log(`Commit SHA: ${commit.sha.substring(0, 7)}`);
            console.log(`Commit message: ${commit.commit.message}`);
            
            // Extract PR number from commit message
            // GitHub merge commits typically have format: "Merge pull request #1234 from..."
            // Or squash commits have: "feat: description (#1234)"
            const message = commit.commit.message;
            const prMatch = message.match(/#(\d+)/);
            
            if (!prMatch) {
              console.log('⚠️ No PR number found in commit message');
              console.log('This might be a direct commit or the commit message format is unexpected');
              return { prs: [], packages: [] };
            }
            
            const prNumber = prMatch[1];
            console.log(`✅ Found PR #${prNumber} in merge commit`);
            
            // Get list of published packages from the deploy workflow
            const packages = ['webex', '@webex/plugin-meetings', '@webex/calling'];
            
            core.setOutput('pr_numbers', JSON.stringify([prNumber]));
            core.setOutput('packages', JSON.stringify(packages));
            core.setOutput('commit_count', '1');
            
            return { 
              prs: [prNumber], 
              packages: packages
            };
      
      - name: Post Release Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version-info.outputs.version }}';
            const versionNumber = '${{ steps.version-info.outputs.version_number }}';
            const prNumbersRaw = '${{ steps.get-prs.outputs.pr_numbers }}';
            const packagesRaw = '${{ steps.get-prs.outputs.packages }}';
            const prNumbers = prNumbersRaw ? JSON.parse(prNumbersRaw) : [];
            const packages = packagesRaw ? JSON.parse(packagesRaw) : [];
            
            console.log(`Posting comment to PR #${prNumbers[0]}`);
            
            if (prNumbers.length === 0) {
              console.log('No PRs found to comment on');
              return;
            }
            
            // Build the changelog URL - only use stable_version to show all commits in that release
            const changelogUrl = `https://webex.github.io/webex-js-sdk/changelog/?stable_version=${versionNumber}`;
            
            // Build the package list markdown
            const packageList = packages.slice(0, 5).map(p => `\`${p}\``).join(', ');
            const morePackages = packages.length > 5 ? ` and ${packages.length - 5} more` : '';
            
            // Create the comment body
            const commentBody = [
              '## 🎉 Your changes are now available!',
              '',
              `**Released in:** [\`${version}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${version})`,
              `**Packages updated:** ${packageList}${morePackages}`,
              '',
              `📖 **[View full changelog →](${changelogUrl})**`,
              '',
              `Thank you for your contribution!`,
              '',
              '---',
              `<sub>🤖 This is an automated message. For questions, please refer to the [documentation](https://github.com/${context.repo.owner}/${context.repo.repo}#readme).</sub>`
            ].join('\n');
            
            // Post comment on each PR
            for (const prNumber of prNumbers) {
              try {
                console.log(`Commenting on PR #${prNumber}`);
                
                // Check if PR exists and is merged
                let pr;
                try {
                  pr = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: parseInt(prNumber)
                  });
                } catch (error) {
                  console.log(`PR #${prNumber} not found or error: ${error.message}`);
                  continue;
                }
                
                if (!pr.data.merged_at) {
                  console.log(`PR #${prNumber} is not merged, skipping`);
                  continue;
                }
                
                // Check if we've already commented (to avoid duplicates)
                const existingComments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(prNumber)
                });
                
                const botCommentExists = existingComments.data.some(comment => 
                  comment.user.type === 'Bot' && 
                  comment.body.includes('Your changes are now available') &&
                  comment.body.includes(version)
                );
                
                if (botCommentExists) {
                  console.log(`Already commented on PR #${prNumber} for version ${version}`);
                  continue;
                }
                
                // Post the comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(prNumber),
                  body: commentBody
                });
                
                console.log(`✅ Successfully commented on PR #${prNumber}`);
              } catch (error) {
                console.error(`Failed to comment on PR #${prNumber}:`, error.message);
              }
            }
            
            console.log('✨ Comment posted successfully!');

      - name: Post Webex Space Message
        if: ${{ steps.get-prs.outputs.pr_numbers != '[]' }}
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
        run: |
          VERSION="${{ steps.version-info.outputs.version }}"
          VERSION_NUMBER="${{ steps.version-info.outputs.version_number }}"
          CHANGELOG_URL="https://web-sdk.webex.com/changelog/?stable_version=${VERSION_NUMBER}"
          RELEASE_URL="https://github.com/webex/webex-js-sdk/releases/tag/${VERSION}"

          MESSAGE="✅ Current stable SDK version: ${VERSION}\n\nRelease: ${RELEASE_URL}\nChangelog: ${CHANGELOG_URL}\n\nThis changelog lists all commits included in this release."

          curl -sSf \
            -H "Authorization: Bearer ${WEBEX_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"roomId\":\"${WEBEX_ROOM_ID}\",\"markdown\":\"${MESSAGE}\"}" \
            https://webexapis.com/v1/messages
      
      - name: Release Summary
        run: |
          echo "### 📊 Bot Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**PR Notified:** ${{ steps.get-prs.outputs.pr_numbers }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Comment posted on the merged PR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Changelog](https://webex.github.io/webex-js-sdk/changelog/?stable_version=${{ steps.version-info.outputs.version_number }})" >> $GITHUB_STEP_SUMMARY

