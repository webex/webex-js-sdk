name: PR Release Comment Bot
run-name: ${{ github.actor }} triggered release comment bot

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test version number (e.g., 3.4.0)'
        required: true
      test_pr_number:
        description: 'Test PR number (e.g., 2) - required for manual testing'
        required: true
  workflow_run:
    workflows: ["Deploy CD"]
    types:
      - completed
    branches:
      - next

jobs:
  comment-on-prs:
    name: Comment on Released PRs
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get PR and Version Info
        id: tag-info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.test_version }}"
            PR_NUMBER="${{ github.event.inputs.test_pr_number }}"
            DEPLOY_SHA="${{ github.sha }}"
            echo "TEST MODE: version=${VERSION}, pr=${PR_NUMBER}"
          else
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            COMMIT_MSG=$(git log -1 --format='%s' "$DEPLOY_SHA")
            PR_NUMBER=$(echo "$COMMIT_MSG" | grep -oE '#[0-9]+' | tail -1 | tr -d '#')

            git fetch --tags
            NEAREST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

            VERSION=""
            if [ -n "$NEAREST_TAG" ]; then
              TAG_SHA=$(git rev-list -n 1 "$NEAREST_TAG" 2>/dev/null || echo "")
              if [ "$TAG_SHA" = "$DEPLOY_SHA" ]; then
                VERSION="$NEAREST_TAG"
              else
                echo "Tag ${NEAREST_TAG} points to ${TAG_SHA}, not deploy SHA ${DEPLOY_SHA} -- tag is stale, using for stable_version only"
              fi
            fi

            echo "Deploy SHA: ${DEPLOY_SHA}, Commit: ${COMMIT_MSG}"
            echo "Tag: ${VERSION:-none (nearest: ${NEAREST_TAG:-none})}, PR: #${PR_NUMBER}"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number found in commit message, skipping"
          fi

          STABLE_VERSION=""
          TAG_FOR_STABLE="${VERSION:-$NEAREST_TAG}"
          if [ -n "$TAG_FOR_STABLE" ]; then
            STABLE_VERSION=$(echo "${TAG_FOR_STABLE#v}" | sed 's/-next\..*//' | sed 's/-[a-z]*\..*//')
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "stable_version=${STABLE_VERSION}" >> $GITHUB_OUTPUT
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "deploy_sha=${DEPLOY_SHA}" >> $GITHUB_OUTPUT

      - name: Get Packages and Versions from Changelog
        id: get-prs
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ steps.tag-info.outputs.pr_number }}';
            const stableVersion = '${{ steps.tag-info.outputs.stable_version }}';

            if (!prNumber) {
              console.log('No PR number found in commit message, skipping');
              core.setOutput('pr_numbers', JSON.stringify([]));
              core.setOutput('package_versions', JSON.stringify({}));
              core.setOutput('primary_package', '');
              return;
            }

            console.log(`Using PR #${prNumber} from deploy commit`);

            if (!stableVersion) {
              console.log('No stable version resolved, skipping changelog lookup');
              core.setOutput('pr_numbers', JSON.stringify([prNumber]));
              core.setOutput('package_versions', JSON.stringify({}));
              core.setOutput('primary_package', '');
              return;
            }

            const fileName = `v${stableVersion.replace(/\./g, '_')}`;
            const changelogUrl = `https://raw.githubusercontent.com/webex/webex-js-sdk/documentation/docs/changelog/logs/${fileName}.json`;
            console.log(`Fetching changelog from: ${changelogUrl}`);

            let changelog = {};
            try {
              const response = await fetch(changelogUrl);
              if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
              }
              changelog = await response.json();
            } catch (error) {
              console.log(`Failed to fetch changelog JSON: ${error.message}`);
              core.setOutput('pr_numbers', JSON.stringify([prNumber]));
              core.setOutput('package_versions', JSON.stringify({}));
              core.setOutput('primary_package', '');
              return;
            }

            const packageVersions = {};
            const prPattern = `#${prNumber}`;

            for (const [pkgName, versions] of Object.entries(changelog)) {
              for (const [ver, data] of Object.entries(versions)) {
                const commits = data.commits || {};
                const matchesPR = Object.values(commits).some(
                  msg => msg.includes(prPattern)
                );
                if (matchesPR) {
                  packageVersions[pkgName] = ver;

                  const alongWith = data.alongWith || {};
                  for (const [alongPkg, alongVer] of Object.entries(alongWith)) {
                    if (!packageVersions[alongPkg]) {
                      packageVersions[alongPkg] = alongVer;
                    }
                  }
                  break;
                }
              }
            }

            if (Object.keys(packageVersions).length === 0) {
              console.log('No matching packages found in changelog for this PR');
            } else {
              console.log('Packages found:');
              for (const [pkg, ver] of Object.entries(packageVersions)) {
                console.log(`  ${pkg} => ${ver}`);
              }
            }

            const directlyChanged = Object.keys(packageVersions).filter(p => p !== 'webex' && p !== 'webex-node');
            const primaryPackage = directlyChanged[0] || Object.keys(packageVersions)[0] || '';

            core.setOutput('pr_numbers', JSON.stringify([prNumber]));
            core.setOutput('package_versions', JSON.stringify(packageVersions));
            core.setOutput('primary_package', primaryPackage);

      - name: Post Release Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.tag-info.outputs.version }}';
            const stableVersion = '${{ steps.tag-info.outputs.stable_version }}';
            const deploySha = '${{ steps.tag-info.outputs.deploy_sha }}';
            const prNumbersRaw = '${{ steps.get-prs.outputs.pr_numbers }}';
            const packageVersionsRaw = '${{ steps.get-prs.outputs.package_versions }}';
            const primaryPackage = '${{ steps.get-prs.outputs.primary_package }}';
            const prNumbers = prNumbersRaw ? JSON.parse(prNumbersRaw) : [];
            const packageVersions = packageVersionsRaw ? JSON.parse(packageVersionsRaw) : {};

            const prNumber = prNumbers[0];
            if (!prNumber) {
              console.log('No PRs found to comment on');
              return;
            }
            console.log(`Posting comment to PR #${prNumber}`);

            const changelogUrl = new URL('https://web-sdk.webex.com/changelog/');
            if (stableVersion) {
              changelogUrl.searchParams.set('stable_version', stableVersion);
            }
            const changelogPackage = packageVersions['webex'] ? 'webex' : primaryPackage;
            if (changelogPackage && packageVersions[changelogPackage]) {
              changelogUrl.searchParams.set('package', changelogPackage);
              changelogUrl.searchParams.set('version', packageVersions[changelogPackage]);
            } else {
              changelogUrl.searchParams.set('commitMessage', `#${prNumber}`);
            }
            console.log(`Changelog URL: ${changelogUrl.toString()}`);

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const releaseLine = version
              ? `| **Released in:** [\`${version}\`](${repoUrl}/releases/tag/${version}) |`
              : `| **Released via:** [\`${deploySha.slice(0, 7)}\`](${repoUrl}/commit/${deploySha}) |`;

            const packageEntries = Object.entries(packageVersions);
            let packagesTable = '';
            if (packageEntries.length > 0) {
              const rows = packageEntries
                .sort(([a], [b]) => {
                  if (a === 'webex') return -1;
                  if (b === 'webex') return 1;
                  if (a === primaryPackage) return -1;
                  if (b === primaryPackage) return 1;
                  return a.localeCompare(b);
                })
                .map(([pkg, ver]) => `| \`${pkg}\` | \`${ver}\` |`)
                .join('\n');
              packagesTable = [
                '',
                '| Packages Updated | Version |',
                '|---------|---------|',
                rows,
                ''
              ].join('\n');
            }

            const commentBody = [
              '| :tada: Your changes are now available! |',
              '|---|',
              releaseLine,
              `| :book: **[View full changelog →](${changelogUrl})** |`,
              packagesTable,
              'Thank you for your contribution!',
              '',
              `_:robot: This is an automated message. For questions, please refer to the [documentation](${repoUrl}#readme)._`
            ].join('\n');

            try {
              let pr;
              try {
                pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: parseInt(prNumber)
                });
              } catch (error) {
                console.log(`PR #${prNumber} not found: ${error.message}`);
                return;
              }

              if (!pr.data.merged_at) {
                console.log(`PR #${prNumber} is not merged, skipping`);
                return;
              }

              const existingComments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prNumber)
              });

              const botCommentExists = existingComments.data.some(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Your changes are now available')
              );

              if (botCommentExists) {
                console.log(`Already commented on PR #${prNumber}, skipping`);
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prNumber),
                body: commentBody
              });

              console.log(`Successfully commented on PR #${prNumber}`);
            } catch (error) {
              console.error(`Failed to comment on PR #${prNumber}:`, error.message);
            }

