name: Deploy CD
run-name: ${{ github.actor }} is running Deploy CD

on:
  push:
    branches: # White-list of deployable tags and branches. Note that all white-listed branches cannot include any `/` characters
      - next
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip NPM publish, tagging, and docs (for testing the workflow)'
        type: boolean
        default: true
      pr_number:
        description: 'PR number to comment on (for testing the comment logic)'
        type: string
        default: ''
      test_version:
        description: 'Version for comment (e.g., v3.5.0-next.1)'
        type: string
        default: ''
      test_packages:
        description: 'Packages for comment (e.g., {webex,@webex/plugin-meetings})'
        type: string
        default: ''


env:
  rid: ${{ github.run_id }}-${{ github.run_number }}
  token: ${{ secrets.NPM_TOKEN }}
  GIT_AUTHOR_NAME: ${{ github.actor }}
  GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com

jobs:
  initialize:
    name: Initialize Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn

      - name: Cache Dependencies
        uses: actions/cache@v3
        if: steps.validate-dependencies.outputs.cache-hit != 'true'
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}


  build:
    name: Build Packages
    needs: initialize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Synchronize Packages
        run: yarn

      - name: Build Tools
        run: yarn workspaces foreach --from '@webex/*-tools' --topological-dev --parallel --verbose run build:src

      - name: Build Webex Core
        run: yarn workspace @webex/webex-core run build:src

      - name: Build Other Packages
        run: yarn workspaces foreach --parallel --topological --verbose run build:src

      - name: Cache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}


  generate-package-matrix:
    name: Determine Changed Packages
    needs: build
    runs-on: ubuntu-latest

    outputs:
      node-changed: ${{ steps.generate-package-matrix-node-changed.outputs.node-changed }} # Used for execution.
      node-recursive: ${{ steps.generate-package-matrix-node-recursive.outputs.node-recursive }} # Used for execution.
      yarn-changed: ${{ steps.generate-package-matrix-yarn-changed.outputs.yarn-changed }} # Used for workspaces.
      yarn-recursive: ${{ steps.generate-package-matrix-yarn-recursive.outputs.yarn-recursive }} # Used for workspaces.

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Update Main Branch
        run: git fetch origin ${GITHUB_REF##*/} --unshallow

        # Used for running node scripts against all changed packages since the last push to the target branch.
      - id: generate-package-matrix-node-changed
        name: Generate Package Matrix
        run: |
          SINCE="${{ github.event.before }}"
          if [ -z "$SINCE" ] || [ "$SINCE" = "0000000000000000000000000000000000000000" ]; then
            SINCE=$(git rev-parse HEAD~1)
          fi
          echo "node-changed=$(yarn package-tools list --mode node --since $SINCE)" >> $GITHUB_OUTPUT

        # Used for running node scripts against all changed packages, and their dependents, since the last push to the target branch.
      - id: generate-package-matrix-node-recursive
        name: Generate Package Matrix
        run: |
          SINCE="${{ github.event.before }}"
          if [ -z "$SINCE" ] || [ "$SINCE" = "0000000000000000000000000000000000000000" ]; then
            SINCE=$(git rev-parse HEAD~1)
          fi
          echo "node-recursive=$(yarn package-tools list --mode node --recursive --since $SINCE)" >> $GITHUB_OUTPUT

        # Used for running yarn tools against all changed packages since the last push to the target branch.
      - id: generate-package-matrix-yarn-changed
        name: Generate Package Matrix
        run: |
          SINCE="${{ github.event.before }}"
          if [ -z "$SINCE" ] || [ "$SINCE" = "0000000000000000000000000000000000000000" ]; then
            SINCE=$(git rev-parse HEAD~1)
          fi
          echo "yarn-changed=$(yarn package-tools list --since $SINCE)" >> $GITHUB_OUTPUT

        # Used for running yarn tools against all changed packages, and their dependents, since the last push to the target branch.
      - id: generate-package-matrix-yarn-recursive
        name: Generate Package Matrix
        run: |
          SINCE="${{ github.event.before }}"
          if [ -z "$SINCE" ] || [ "$SINCE" = "0000000000000000000000000000000000000000" ]; then
            SINCE=$(git rev-parse HEAD~1)
          fi
          echo "yarn-recursive=$(yarn package-tools list --recursive --since $SINCE)" >> $GITHUB_OUTPUT

      - name: Display Package Matrix
        run: |
          echo "changed packages for node - ${{ steps.generate-package-matrix-node-changed.outputs.node-changed}}"
          echo "changed packages and dependents for node - ${{ steps.generate-package-matrix-node-recursive.outputs.node-recursive }}"
          echo "changed packages for yarn - ${{ steps.generate-package-matrix-yarn-changed.outputs.yarn-changed}}"
          echo "changed packages and dependents for yarn - ${{ steps.generate-package-matrix-yarn-recursive.outputs.yarn-recursive }}"


  publish-npm:
    name: Publish - NPM
    needs: generate-package-matrix
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.dry_run != true }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Add NPM token to .yarnrc.yml file
        run: |
          echo "npmAuthToken: ${{ env.token }}" >> ~/.yarnrc.yml

      - name: Synchronize Packages
        run: |
          yarn
          yarn package-tools sync --tag ${GITHUB_REF##*/}

      - name: Display Notice
        run: |
          echo "packages to increment: ${{ needs.generate-package-matrix.outputs.node-recursive }}"
          echo "tag to increment: ${GITHUB_REF##*/}"

      - name: Increment Package Versions
        run: yarn package-tools increment --packages ${{ needs.generate-package-matrix.outputs.node-recursive }} --tag ${GITHUB_REF##*/}

      - name: Build all packages for publish
        run: yarn run build:publish

      - name: Build a webex UMD
        run: yarn run build:script

      - name: Deploy Packages
        run: yarn workspaces foreach --from '${{ needs.generate-package-matrix.outputs.yarn-recursive }}' --verbose run deploy:npm --access public --tag ${GITHUB_REF##*/}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-documentation:
    name: Publish - Documentation
    needs: [publish-npm,generate-package-matrix]
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/wxcc' && (github.event_name == 'push' || inputs.dry_run != true) }}

    steps:
      - name: Documentation Deploy Steps
        run: echo "Documentation Deploy Steps"

      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Build tools and set versions
        run: |
          yarn workspaces foreach --from '@webex/*-tools' --topological-dev --parallel --verbose run build:src
          yarn package-tools sync --tag ${GITHUB_REF##*/}

      - name: Build packages locally
        run: yarn build:local

      - name: Build Docs
        run: yarn run build:docs

      - name: Set Git Identity
        run: |
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git config user.name "${GIT_AUTHOR_NAME}"

      - name: Get existing changelog from documentation Branch
        run: | 
          git fetch origin documentation
          git checkout origin/documentation -- docs/changelog/logs

      - name: Update changelog
        run: yarn package-tools changelog --packages ${{ needs.generate-package-matrix.outputs.node-recursive }} --tag ${GITHUB_REF##*/} --commit ${{ github.event.before }}

      - name: Update Changelog and Publish Docs Folder
        run: |
          # Check if there's anything to commit before committing
          if [ -n "$(git status --porcelain)" ]; then
            git add docs/
            git commit -m "chore(docs): update docs"
            git push origin HEAD:documentation --force
          fi

  publish-tag:
    name: Publish - Tags
    runs-on: ubuntu-latest
    needs: [generate-package-matrix, publish-npm]
    if: ${{ github.event_name == 'push' || inputs.dry_run != true }}

    outputs:
      message: ${{ steps.versionextractor.outputs.message }}
      version: ${{ steps.versionextractor.outputs.version }}
      commit: ${{ steps.lastcommit.outputs.commit }}
      proceed: ${{ steps.skipcondition.outputs.proceed }}
      package_name: ${{ steps.changedpackage.outputs.package_name }}
      package_version: ${{ steps.changedpackage.outputs.package_version }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Extract latest version from NPM and commit message
        id: versionextractor
        run: |
          yarn ws:tools
          echo "message=$(git log -1 --oneline --no-decorate)" >> $GITHUB_OUTPUT
          echo "version=v$(yarn package-tools sync --tag ${GITHUB_REF##*/} --packages webex | awk '{print $3}' | tr -d '%')" >> $GITHUB_OUTPUT

      - name: Extract changed package version
        id: changedpackage
        run: |
          PACKAGES="${{ needs.generate-package-matrix.outputs.node-recursive }}"
          CLEAN=$(echo "$PACKAGES" | tr -d '{}')
          if echo "$CLEAN" | tr ',' '\n' | grep -q "^webex$"; then
            PKG="webex"
          else
            PKG=$(echo "$CLEAN" | tr ',' '\n' | head -1 | tr -d ' ')
          fi
          if [ -n "$PKG" ]; then
            PKG_VERSION=$(yarn package-tools sync --tag ${GITHUB_REF##*/} --packages $PKG | awk '{print $3}' | tr -d '%')
            echo "package_name=${PKG}" >> $GITHUB_OUTPUT
            echo "package_version=v${PKG_VERSION}" >> $GITHUB_OUTPUT
            echo "📦 Selected package: ${PKG} version: ${PKG_VERSION}"
          fi

      - name: Conditions to skip tag publish
        id: skipcondition
        run: |
          echo "proceed=true" >> $GITHUB_OUTPUT
          if git rev-parse "${{ steps.versionextractor.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.versionextractor.outputs.version }} already exists. Exiting job."
            echo "proceed=false" >> $GITHUB_OUTPUT
          elif [ -z ${{ needs.generate-package-matrix.outputs.node-recursive }} ]; then
            echo "No packages published, therefore, publishing a tag is unnecessary. Exiting job."
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "Creating the tag."
          fi

      - name: Get the last commit hash
        id: lastcommit
        run: |
          if [ ${{ steps.skipcondition.outputs.proceed }} = false ]; then
            echo "Skipping this step."
          else
            echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Set Git Identity
        run: |
          if [ ${{ steps.skipcondition.outputs.proceed }} = false ]; then
            echo "Skipping this step."
          else
            git config user.email "${GIT_AUTHOR_EMAIL}"
            git config user.name "${GIT_AUTHOR_NAME}"
          fi

      - name: Create a tag for the last commit
        run: |
          if [ ${{ steps.skipcondition.outputs.proceed }} = false ]; then
            echo "Skipping this step."
          else
            git tag -a "${{ steps.versionextractor.outputs.version }}" ${{ steps.lastcommit.outputs.commit }} -m "${{ steps.versionextractor.outputs.message }}"
          fi

      - name: Publish the tag to GitHub
        run: |
          if [ ${{ steps.skipcondition.outputs.proceed }} = false ]; then
            echo "Skipping this step."
          else
            git push origin ${{ steps.versionextractor.outputs.version }}
          fi

  comment-on-prs:
    name: Comment on Merged PR
    needs: [publish-tag, generate-package-matrix]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.generate-package-matrix.result == 'success' &&
      (needs.generate-package-matrix.outputs.node-recursive != '' || inputs.pr_number != '')

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3

      - name: Get Pull Request Number
        id: pr
        run: |
          if [ -n "${{ inputs.pr_number }}" ]; then
            echo "pull_request_number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "pull_request_number=$(gh pr view --json number -q .number || echo "")" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-detect Version from Tags
        id: tag-version
        run: |
          git fetch --tags origin next
          VERSION=$(git describe --tags --abbrev=0 origin/next 2>/dev/null || echo "")
          echo "📋 Auto-detected version from tags: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Auto-detect Packages from PR
        id: pr-packages
        if: ${{ steps.pr.outputs.pull_request_number != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = parseInt('${{ steps.pr.outputs.pull_request_number }}');
            console.log(`📋 Detecting packages from PR #${prNumber} files...`);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            const packages = new Set();
            for (const file of files) {
              if (!file.filename.startsWith('packages/')) continue;
              const parts = file.filename.split('/');
              if (parts[1] === '@webex' && parts.length >= 3) {
                packages.add(`@webex/${parts[2]}`);
              } else if (parts.length >= 2) {
                packages.add(parts[1]);
              }
            }
            if (packages.size === 0) packages.add('webex');

            const pkgList = Array.from(packages);
            const primary = pkgList.includes('webex') ? 'webex' : pkgList[0];
            console.log(`📋 Auto-detected packages: ${pkgList.join(', ')}`);
            console.log(`📋 Primary package: ${primary}`);
            core.setOutput('packages', `{${pkgList.join(',')}}`);
            core.setOutput('primary_package', primary);

      - name: Post Comment on PR
        if: ${{ steps.pr.outputs.pull_request_number != '' }}
        uses: actions/github-script@v7
        env:
          INPUT_VERSION: ${{ needs.publish-tag.outputs.package_version || steps.tag-version.outputs.version || 'v0.0.0-dry-run' }}
          INPUT_PACKAGES: ${{ needs.generate-package-matrix.outputs.node-recursive || steps.pr-packages.outputs.packages || 'webex' }}
          INPUT_PR_NUMBER: ${{ steps.pr.outputs.pull_request_number }}
          INPUT_PACKAGE_NAME: ${{ needs.publish-tag.outputs.package_name || steps.pr-packages.outputs.primary_package || 'webex' }}
        with:
          script: |
            const version = process.env.INPUT_VERSION || '';
            const versionNumber = version.replace(/^v/, '');
            const prNumber = parseInt(process.env.INPUT_PR_NUMBER);

            if (!prNumber) {
              console.log('No PR number found, skipping');
              return;
            }

            console.log(`Posting comment on PR #${prNumber} for version ${version}`);

            const existingComments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const alreadyCommented = existingComments.data.some(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Your changes are now available') &&
              c.body.includes(version)
            );

            if (alreadyCommented) {
              console.log(`Already commented on PR #${prNumber} for ${version}`);
              return;
            }

            const packagesRaw = process.env.INPUT_PACKAGES || '';
            const packages = packagesRaw
              .replace(/[{}]/g, '')
              .split(',')
              .map(p => p.trim())
              .filter(Boolean);

            const primaryPackage = process.env.INPUT_PACKAGE_NAME || 'webex';
            const packageList = packages.slice(0, 5).map(p => `\`${p}\``).join(', ');
            const morePackages = packages.length > 5 ? ` and ${packages.length - 5} more` : '';

            const stableVersion = versionNumber.replace(/-next\..*$/, '');
            const changelogUrl = `https://web-sdk.webex.com/changelog/?stable_version=${stableVersion}&package=${primaryPackage}&version=${versionNumber}`;

            const commentBody = [
              '## 🎉 Your changes are now available!',
              '',
              `**Released in:** [\`${version}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${version})`,
              `**Packages updated:** ${packageList}${morePackages}`,
              '',
              `📖 **[View full changelog →](${changelogUrl})**`,
              '',
              '---',
              `<sub>🤖 This is an automated message.</sub>`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

            console.log(`✅ Commented on PR #${prNumber}`);
