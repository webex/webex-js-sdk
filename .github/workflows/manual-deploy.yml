name: Manual Deploy
run-name: ${{ github.actor }} is manually deploying packages to version ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to deploy (e.g., 1.2.3, 1.2.3-beta.1, 1.2.3+build.5)'
        required: true
        type: string
      dist-tag:
        description: 'NPM dist-tag to publish under'
        required: false
        type: choice
        default: latest
        options:
          - latest
          - next
          - beta
          - alpha

# Prevent concurrent manual deploys for the same version from racing on the
# documentation force-push and tag creation.
concurrency:
  group: manual-deploy-${{ inputs.version }}
  cancel-in-progress: false

env:
  rid: ${{ github.run_id }}-${{ github.run_number }}
  GIT_AUTHOR_NAME: ${{ github.actor }}
  GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com

jobs:
  authorize:
    name: Authorize Actor
    runs-on: ubuntu-latest

    steps:
      # workflow_dispatch already restricts triggers to actors with write access,
      # but publishing to NPM is sensitive enough to gate behind an explicit
      # allowlist of maintainers permitted to run a manual release.
      - name: Check actor against allowlist
        env:
          ACTOR: ${{ github.actor }}
          ALLOWED_ACTORS: |
            mkesavan13
            bhabalan
        run: |
          if ! grep -Fxq "$ACTOR" <<< "$ALLOWED_ACTORS"; then
            echo "::error::Actor '$ACTOR' is not authorized to run the manual deploy workflow."
            echo "Authorized actors:"
            echo "$ALLOWED_ACTORS"
            exit 1
          fi
          echo "Actor '$ACTOR' is authorized."

  initialize:
    name: Initialize Project
    needs: authorize
    runs-on: ubuntu-latest

    steps:
      - name: Validate Version Format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' <<< "$VERSION"; then
            echo "Error: Version '$VERSION' is not a valid semver string."
            echo "Expected format: x.y.z, x.y.z-prerelease, or x.y.z+build (e.g., 1.2.3, 1.2.3-beta.1)"
            exit 1
          fi

      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 downloads the complete git history, required for
          # changelog generation and tag operations downstream.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Install Dependencies
        run: yarn

  build:
    name: Build Packages
    needs: initialize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Synchronize Packages
        run: yarn

      - name: Build Tools
        run: yarn workspaces foreach --from '@webex/*-tools' --topological-dev --parallel --verbose run build:src

      - name: Build Webex Core
        run: yarn workspace @webex/webex-core run build:src

      - name: Build Other Packages
        run: yarn workspaces foreach --parallel --topological --verbose run build:src

      - name: Cache Distributables
        uses: actions/cache@v4
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

  publish-npm:
    name: Publish - NPM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Restore Distributables Cache
        uses: actions/cache@v4
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Set Package Versions
        # `package-tools` does not expose a `version set` command, so use
        # `npm pkg set` across non-private workspaces to write the requested
        # version into every publishable package.json. Internal package deps
        # use `workspace:*` and don't need rewriting.
        env:
          VERSION: ${{ inputs.version }}
        run: yarn workspaces foreach --all --no-private exec npm pkg set version="$VERSION"

      - name: Display Package Information
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          echo "Setting all packages to version: $VERSION"
          echo "Packages will be published with '$DIST_TAG' tag"

      - name: Build all packages for publish
        run: yarn run build:publish

      - name: Build a webex UMD
        run: yarn run build:script

      - name: Get publishable packages
        id: get-publishable
        # `package-tools list` (no flags) excludes packages marked `private: true`,
        # so internal-only workspaces (samples, helpers, etc.) are filtered out.
        # Output format `{pkg1,pkg2,...}` is consumed directly by `yarn workspaces foreach --from`.
        run: echo "packages=$(yarn package-tools list)" >> "$GITHUB_OUTPUT"

      - name: Add NPM token to .yarnrc.yml file
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npmAuthToken: $NPM_TOKEN" >> ~/.yarnrc.yml

      - name: Deploy Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist-tag }}
          PACKAGES: ${{ steps.get-publishable.outputs.packages }}
        run: yarn workspaces foreach --from "$PACKAGES" --verbose run deploy:npm --access public --tag "$DIST_TAG"

  publish-documentation:
    name: Publish - Documentation
    needs: publish-npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Restore Distributables Cache
        uses: actions/cache@v4
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Build tools and set versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          yarn workspaces foreach --from '@webex/*-tools' --topological-dev --parallel --verbose run build:src
          yarn workspaces foreach --all --no-private exec npm pkg set version="$VERSION"

      - name: Build packages locally
        run: yarn build:local

      - name: Build Docs
        run: yarn run build:docs

      - name: Set Git Identity
        run: |
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git config user.name "${GIT_AUTHOR_NAME}"

      - name: Get existing changelog from documentation Branch
        run: |
          git fetch origin documentation
          git checkout origin/documentation -- docs/changelog/logs

      - name: Get all package names for changelog
        id: get-packages
        run: |
          PACKAGES=$(yarn package-tools list | tr '\n' ' ' | sed 's/ *$//')
          {
            echo 'packages<<EOF'
            echo "$PACKAGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update changelog
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          # Anchor the changelog to the previous release tag so a manual deploy
          # captures every commit since the last release, not just HEAD~1.
          # Fall back to HEAD~1 only when no prior tag exists (fresh repos).
          if PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            PREVIOUS_COMMIT=$(git rev-list -n 1 "$PREVIOUS_TAG")
            echo "Using previous tag '$PREVIOUS_TAG' ($PREVIOUS_COMMIT) as changelog base."
          else
            PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
            echo "No prior tag found; falling back to HEAD~1 ($PREVIOUS_COMMIT) as changelog base."
          fi
          yarn package-tools changelog --packages ${{ steps.get-packages.outputs.packages }} --tag "$DIST_TAG" --commit "$PREVIOUS_COMMIT"

      - name: Update Changelog and Publish Docs Folder
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add docs/
            git commit -m "chore(docs): update docs for manual deployment v$VERSION"
            # --force-with-lease prevents overwriting concurrent commits to the
            # documentation branch from other workflows.
            git push origin HEAD:documentation --force-with-lease
          fi

  publish-tag:
    name: Publish - Tags
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-documentation]

    outputs:
      message: ${{ steps.versionextractor.outputs.message }}
      version: ${{ steps.versionextractor.outputs.version }}
      commit: ${{ steps.lastcommit.outputs.commit }}
      proceed: ${{ steps.skipcondition.outputs.proceed }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Synchronize Packages
        run: yarn

      - name: Extract latest version and commit message
        id: versionextractor
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo 'message<<EOF'
            git log -1 --oneline --no-decorate
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Conditions to skip tag publish
        id: skipcondition
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping tag creation."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating the tag v$VERSION."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the last commit hash
        id: lastcommit
        if: steps.skipcondition.outputs.proceed == 'true'
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set Git Identity
        if: steps.skipcondition.outputs.proceed == 'true'
        run: |
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git config user.name "${GIT_AUTHOR_NAME}"

      - name: Create a tag for the last commit
        if: steps.skipcondition.outputs.proceed == 'true'
        env:
          TAG_VERSION: ${{ steps.versionextractor.outputs.version }}
          TAG_MESSAGE: ${{ steps.versionextractor.outputs.message }}
          TAG_COMMIT: ${{ steps.lastcommit.outputs.commit }}
        run: git tag -a "$TAG_VERSION" "$TAG_COMMIT" -m "$TAG_MESSAGE"

      - name: Publish the tag to GitHub
        if: steps.skipcondition.outputs.proceed == 'true'
        env:
          TAG_VERSION: ${{ steps.versionextractor.outputs.version }}
        run: git push origin "$TAG_VERSION"
