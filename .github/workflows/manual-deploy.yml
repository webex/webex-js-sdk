name: Manual Deploy
run-name: ${{ github.actor }} is manually ${{ inputs.dry-run && 'dry-running' || 'deploying' }} packages${{ inputs.version && format(' (v{0})', inputs.version) || ' (auto version)' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to deploy (e.g., 1.2.3, 1.2.3-beta.1, 1.2.3+build.5). Leave blank to auto-generate a minor bump of the current stable release.'
        required: false
        type: string
      dist-tag:
        description: 'NPM dist-tag to publish under'
        required: false
        type: choice
        default: latest
        options:
          - latest
          - next
          - beta
          - alpha
      dry-run:
        description: 'Dry run — validate packaging without publishing to NPM, pushing docs, or creating a git tag.'
        required: false
        type: boolean
        default: false

# Prevent concurrent manual deploys from racing on the documentation
# force-push and tag creation. Explicit-version runs serialize per version.
# Blank (auto-version) runs share a single stable key so they cannot run
# concurrently: each resolves the next version from the current `latest`, so
# two simultaneous runs would otherwise resolve the same version and the loser
# would fail after doing release work.
concurrency:
  group: manual-deploy-${{ inputs.version || 'auto' }}
  cancel-in-progress: false

env:
  rid: ${{ github.run_id }}-${{ github.run_number }}
  GIT_AUTHOR_NAME: ${{ github.actor }}
  GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com

jobs:
  authorize:
    name: Authorize Actor
    runs-on: ubuntu-latest

    steps:
      # workflow_dispatch already restricts triggers to actors with write access,
      # but publishing to NPM is sensitive enough to gate behind membership of
      # the cypher-sdk-release-team. The default GITHUB_TOKEN cannot read org
      # team membership, so this uses ORG_READ_TOKEN (a token with the org
      # "Members: read" permission). The team's actual membership is the single
      # source of truth — no usernames are hardcoded here.
      - name: Check actor is on the release team
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ACTOR: ${{ github.actor }}
          ORG: webex
          TEAM_SLUG: cypher-sdk-release-team
        run: |
          # The memberships endpoint returns 200 with state "active" for current
          # members, 200 with state "pending" for invited-but-not-joined users,
          # and 404 for everyone else. Only an active membership authorizes a run.
          STATE=$(gh api \
            "orgs/$ORG/teams/$TEAM_SLUG/memberships/$ACTOR" \
            --jq '.state' 2>/dev/null) || STATE=""
          if [ "$STATE" != "active" ]; then
            echo "::error::Actor '$ACTOR' is not an active member of @$ORG/$TEAM_SLUG and is not authorized to run the manual deploy workflow."
            exit 1
          fi
          echo "Actor '$ACTOR' is an active member of @$ORG/$TEAM_SLUG; authorized."

  initialize:
    name: Initialize Project
    needs: authorize
    runs-on: ubuntu-latest

    steps:
      - name: Validate Version Format
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          # A blank version is valid only for the `latest` tag: the build job
          # auto-generates a minor bump of the current stable release. For
          # non-`latest` tags an auto-bump would still advance the stable
          # version, then publish that stable-looking version under the
          # prerelease tag (npm's --tag does not move `latest`). The stable
          # version number would be burned and the next stable auto-release
          # would resolve an already-published version and fail. Require an
          # explicit version for prerelease tags.
          if [ -z "$VERSION" ]; then
            if [ "$DIST_TAG" != "latest" ]; then
              echo "Error: a version is required when publishing under the '$DIST_TAG' tag."
              echo "Auto-version is only supported for the 'latest' tag; provide an explicit version (e.g., 1.2.3-$DIST_TAG.1)."
              exit 1
            fi
            echo "No version provided; it will be auto-generated during the build job."
            exit 0
          fi
          # Only accept the version shapes package-tools can round-trip. Its
          # changelog parser (Package.parseVersionStringToObject) reads a
          # version as `major.minor.patch` plus an optional `-<tag>.<release>`
          # suffix; it discards build metadata (`+...`) and rewrites a bare
          # prerelease (`-beta`) to `-beta.0`. Allowing those shapes would make
          # the docs/changelog point at a different version than the one
          # published to NPM and tagged in git, so restrict input to plain
          # releases and fully-qualified `-<tag>.<release>` prereleases.
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+\.[0-9]+)?$' <<< "$VERSION"; then
            echo "Error: Version '$VERSION' is not a supported release version."
            echo "Expected x.y.z or x.y.z-<tag>.<n> (e.g., 1.2.3 or 1.2.3-beta.1)."
            echo "Build metadata (+...) and bare prereleases (-beta) are not supported because the changelog tooling cannot preserve them."
            exit 1
          fi

      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 downloads the complete git history, required for
          # changelog generation and tag operations downstream.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Install Dependencies
        run: yarn

  build:
    name: Build Packages
    needs: initialize
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.list.outputs.packages }}
      packages-glob: ${{ steps.list.outputs.packages-glob }}
      version: ${{ steps.resolve-version.outputs.version }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Synchronize Packages
        run: yarn

      - name: Build Tools
        run: yarn workspaces foreach --from '@webex/*-tools' --topological-dev --parallel --verbose run build:src

      - name: Build Webex Core
        run: yarn workspace @webex/webex-core run build:src

      - name: Build Other Packages
        run: yarn workspaces foreach --parallel --topological --verbose run build:src

      - name: Resolve publishable packages
        id: list
        # Resolve the set of non-private workspaces once, the single source of
        # truth for which packages get version-set, published, and changelogged.
        # Two forms are emitted because consumers need different shapes:
        #   - `packages` (node mode): a space-separated list, passed unquoted to
        #     `package-tools changelog --packages` as variadic args.
        #   - `packages-glob` (yarn mode): a single `{a,b,c}` brace pattern that
        #     `yarn workspaces foreach --from` accepts as one glob ident. The
        #     space-separated list does NOT work with `--from`: quoted it is a
        #     single glob containing spaces (matches nothing); unquoted only the
        #     first word becomes `--from` and the rest are misparsed.
        run: |
          PACKAGES=$(yarn package-tools list --mode node)
          PACKAGES_GLOB=$(yarn package-tools list --mode yarn)
          if [ -z "$PACKAGES" ] || [ -z "$PACKAGES_GLOB" ]; then
            echo "::error::No publishable packages resolved." >&2
            exit 1
          fi
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "packages-glob=$PACKAGES_GLOB" >> "$GITHUB_OUTPUT"

      - name: Resolve deploy version
        id: resolve-version
        # When the operator supplies a version it is used verbatim. When the
        # input is blank we auto-generate a minor bump of the current stable
        # (`latest`) release of the `webex` package — e.g. 3.12.0 -> 3.13.0 —
        # which is then applied uniformly to every publishable package. The
        # `increment` command prints `webex => x.y.z`; we take the version after
        # the arrow.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "Using operator-provided version: $VERSION"
          else
            VERSION=$(yarn package-tools increment --packages webex --tag latest --minor 1 | awk -F' => ' '{print $2}' | tr -d '[:space:]')
            if [ -z "$VERSION" ]; then
              echo "::error::Failed to auto-generate a version." >&2
              exit 1
            fi
            echo "Auto-generated version (minor bump of current stable): $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Distributables
        uses: actions/cache@v4
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

  publish-npm:
    name: Publish - NPM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Restore Distributables Cache
        uses: actions/cache@v4
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Set Package Versions
        # `package-tools` does not expose a `version set` command, so use
        # `npm pkg set` across the resolved publishable workspaces to write
        # the requested version into every publishable package.json.
        # Internal package deps use `workspace:*` and don't need rewriting.
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGES_GLOB: ${{ needs.build.outputs.packages-glob }}
        run: yarn workspaces foreach --from "$PACKAGES_GLOB" exec npm pkg set version="$VERSION"

      - name: Display Package Information
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          echo "Setting all packages to version: $VERSION"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: packaging will be validated but NOT published to NPM."
          else
            echo "Packages will be published with '$DIST_TAG' tag"
          fi

      - name: Build all packages for publish
        run: yarn run build:publish

      - name: Build a webex UMD
        run: yarn run build:script

      - name: Add NPM token to .yarnrc.yml file
        if: ${{ inputs.dry-run != true }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npmAuthToken: $NPM_TOKEN" >> ~/.yarnrc.yml

      - name: Deploy Packages
        if: ${{ inputs.dry-run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist-tag }}
          PACKAGES_GLOB: ${{ needs.build.outputs.packages-glob }}
        run: yarn workspaces foreach --from "$PACKAGES_GLOB" --verbose run deploy:npm --access public --tag "$DIST_TAG"

      - name: Deploy Packages (Dry Run)
        if: ${{ inputs.dry-run == true }}
        # `yarn npm publish` has no `--dry-run`, so use `yarn pack --dry-run`,
        # which resolves `workspace:*` deps and exercises the full packaging
        # path (file selection, prepack scripts) without uploading anything.
        env:
          PACKAGES_GLOB: ${{ needs.build.outputs.packages-glob }}
        run: yarn workspaces foreach --from "$PACKAGES_GLOB" --verbose pack --dry-run

  publish-documentation:
    name: Publish - Documentation
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    # A dry run validates packaging only; it must not force-push docs.
    if: ${{ inputs.dry-run != true }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Restore Distributables Cache
        uses: actions/cache@v4
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Build tools and set versions
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGES_GLOB: ${{ needs.build.outputs.packages-glob }}
        run: |
          yarn workspaces foreach --from '@webex/*-tools' --topological-dev --parallel --verbose run build:src
          yarn workspaces foreach --from "$PACKAGES_GLOB" exec npm pkg set version="$VERSION"

      - name: Build packages locally
        run: yarn build:local

      - name: Build Docs
        run: yarn run build:docs

      - name: Set Git Identity
        run: |
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git config user.name "${GIT_AUTHOR_NAME}"

      - name: Get existing changelog from documentation Branch
        run: |
          git fetch origin documentation
          git checkout origin/documentation -- docs/changelog/logs

      - name: Update changelog
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
          PACKAGES: ${{ needs.build.outputs.packages }}
        run: |
          # Anchor the changelog to the previous release tag so a manual deploy
          # captures every commit since the last release, not just HEAD~1.
          # Fall back to HEAD~1 only when no prior tag exists (fresh repos).
          if PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            PREVIOUS_COMMIT=$(git rev-list -n 1 "$PREVIOUS_TAG")
            echo "Using previous tag '$PREVIOUS_TAG' ($PREVIOUS_COMMIT) as changelog base."
          else
            PREVIOUS_COMMIT=$(git rev-parse HEAD~1)
            echo "No prior tag found; falling back to HEAD~1 ($PREVIOUS_COMMIT) as changelog base."
          fi
          # `--packages` is intentionally unquoted so commander receives the
          # workspace names as variadic args (matching deploy.yml's invocation).
          yarn package-tools changelog --packages $PACKAGES --tag "$DIST_TAG" --commit "$PREVIOUS_COMMIT"

      - name: Update Changelog and Publish Docs Folder
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add docs/
            git commit -m "chore(docs): update docs for manual deployment v$VERSION"
            # --force-with-lease prevents overwriting concurrent commits to the
            # documentation branch from other workflows.
            git push origin HEAD:documentation --force-with-lease
          fi

  publish-tag:
    name: Publish - Tags
    runs-on: ubuntu-latest
    needs: [build, publish-npm, publish-documentation]
    # A dry run validates packaging only; it must not create or push a git tag.
    if: ${{ inputs.dry-run != true }}

    outputs:
      message: ${{ steps.versionextractor.outputs.message }}
      version: ${{ steps.versionextractor.outputs.version }}
      commit: ${{ steps.lastcommit.outputs.commit }}
      proceed: ${{ steps.skipcondition.outputs.proceed }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Synchronize Packages
        run: yarn

      - name: Extract latest version and commit message
        id: versionextractor
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo 'message<<EOF'
            git log -1 --oneline --no-decorate
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Conditions to skip tag publish
        id: skipcondition
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping tag creation."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating the tag v$VERSION."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the last commit hash
        id: lastcommit
        if: steps.skipcondition.outputs.proceed == 'true'
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set Git Identity
        if: steps.skipcondition.outputs.proceed == 'true'
        run: |
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git config user.name "${GIT_AUTHOR_NAME}"

      - name: Create a tag for the last commit
        if: steps.skipcondition.outputs.proceed == 'true'
        env:
          TAG_VERSION: ${{ steps.versionextractor.outputs.version }}
          TAG_MESSAGE: ${{ steps.versionextractor.outputs.message }}
          TAG_COMMIT: ${{ steps.lastcommit.outputs.commit }}
        run: git tag -a "$TAG_VERSION" "$TAG_COMMIT" -m "$TAG_MESSAGE"

      - name: Publish the tag to GitHub
        if: steps.skipcondition.outputs.proceed == 'true'
        env:
          TAG_VERSION: ${{ steps.versionextractor.outputs.version }}
        run: git push origin "$TAG_VERSION"
