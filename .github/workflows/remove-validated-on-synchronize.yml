name: Remove Validated Label On New Push
run-name: Remove validated label for PR #${{ github.event.pull_request.number }}

on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  remove-validated-label:
    name: Remove reusable validated and test_e2e labels
    runs-on: ubuntu-latest
    steps:
      - name: Remove validated and test_e2e labels from PR
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const labels = context.payload.pull_request.labels.map((label) => label.name);

            for (const name of ['validated', 'test_e2e']) {
              if (!labels.includes(name)) {
                core.info(`No ${name} label found; skipping.`);
                continue;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pull_number,
                  name,
                });

                core.info(`Removed ${name} label after synchronize event.`);
              } catch (error) {
                core.warning(`Failed to remove ${name} label: ${error.message}`);
              }
            }
