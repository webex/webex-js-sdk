name: Remove Validated Label On New Push
run-name: Remove validated label for PR #${{ github.event.pull_request.number }}

on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  remove-validated-label:
    name: Remove reusable validated label
    runs-on: ubuntu-latest
    steps:
      # The validated label survives a push only when both the PR author and the
      # pusher are active members of @webex/web-sdk. Both identities matter, for
      # different reasons: anyone can be given push access to someone else's
      # branch, so a non-member pushing to a member's PR must still invalidate
      # the label; and a PR opened by a non-member should revalidate even when a
      # member later pushes to it. Commit author metadata is deliberately not
      # consulted, as it is self-reported and spoofable, while both of these
      # identities are authenticated by GitHub. The default GITHUB_TOKEN cannot
      # read org team membership, hence ORG_READ_TOKEN. The team's actual
      # membership is the single source of truth, no usernames are hardcoded.
      # Only runs when there is a label to act on.
      - name: Check web-sdk team membership
        id: team
        if: contains(github.event.pull_request.labels.*.name, 'validated')
        # An inconclusive lookup must not strand the label. This step is allowed
        # to fail so the removal below still runs, which is the safe direction,
        # while the failure annotation keeps the problem visible.
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ORG_READ_TOKEN }}
          script: |
            const org = 'webex';
            const team_slug = 'web-sdk';

            // GitHub answers 404 for resources a token cannot see, so a
            // membership 404 only means "not a member" once the token is known
            // to be able to read the team at all. Without this check, a token
            // that loses visibility would report every user as a non-member and
            // quietly turn the skip off for good.
            try {
              await github.rest.teams.getByName({org, team_slug});
            } catch (error) {
              core.setFailed(
                `Cannot read @${org}/${team_slug} (${error.status} ${error.message}); ` +
                  'a membership 404 would be indistinguishable from missing access.'
              );

              return;
            }

            // 'active' for members, 'pending' for invited-but-not-joined, 404
            // for everyone else (including bots and apps, which have no
            // membership). Any other failure stays 'unknown' so an outage is
            // never mistaken for a confirmed non-member.
            const membershipState = async (username) => {
              try {
                const {data} = await github.rest.teams.getMembershipForUserInOrg({
                  org,
                  team_slug,
                  username,
                });

                return data.state;
              } catch (error) {
                if (error.status === 404) {
                  return 'none';
                }

                core.warning(`Lookup for ${username} failed: ${error.status} ${error.message}`);

                return 'unknown';
              }
            };

            const author = context.payload.pull_request.user.login;
            const pusher = context.payload.sender.login;
            const [authorState, pusherState] = await Promise.all([
              membershipState(author),
              membershipState(pusher),
            ]);

            core.info(`PR author ${author} on @${org}/${team_slug}: ${authorState}`);
            core.info(`Pusher ${pusher} on @${org}/${team_slug}: ${pusherState}`);

            core.setOutput('keep_label', authorState === 'active' && pusherState === 'active');

            if (authorState === 'unknown' || pusherState === 'unknown') {
              core.setFailed('Membership lookup was inconclusive; removing the validated label as the safe default.');
            }

      - name: Remove validated label from PR
        env:
          KEEP_LABEL: ${{ steps.team.outputs.keep_label }}
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const labels = context.payload.pull_request.labels.map((label) => label.name);
            if (!labels.includes('validated')) {
              core.info('No validated label found; skipping.');
              return;
            }

            if (process.env.KEEP_LABEL === 'true') {
              core.info('PR author and pusher are both active members of @webex/web-sdk; keeping the validated label.');
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pull_number,
                name: 'validated',
              });

              core.info('Removed validated label after synchronize event.');
            } catch (error) {
              core.warning(`Failed to remove validated label: ${error.message}`);
            }
